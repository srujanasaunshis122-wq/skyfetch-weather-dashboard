<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyFetch Weather Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">

    <header>
      <h1>🌤 SkyFetch Weather Dashboard</h1>
    </header>

   <div class="search-section">
  <input 
    type="text" 
    id="search-input" 
    placeholder="Enter city name..."
  />
  <button id="search-btn">Search</button>
</div>

<!-- ✅ ADD THIS BLOCK HERE -->
<div id="recent-searches-section" class="recent-searches-section">
  <h3>Recent Searches</h3>
  <div id="recent-searches-container"></div>
  <button id="clear-history-btn">Clear History</button>
</div>
<!-- ✅ END ADD -->

<div id="weather-container">
  <p>Search for a city to see weather details 🌤</p>
</div> 

  <script src="app.js"></script>

</body>
</html>
